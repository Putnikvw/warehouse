# Application Settings
spring:
  application:
    name: warehouse
  datasource:
    url: jdbc:postgresql://${DB_URL:localhost}:${PORT:5432}/${DB_NAME:warehouse_db}
    username: ${USER_DB:postgres}
    password: ${PASSWORD_DB:Test1234!}
    driver-class-name: org.postgresql.Driver
    hikari.maximum-pool-size: 10
    hikari.minimum-idle: 5
    hikari.connection-timeout: 20000
    hikari.idle-timeout: 300000
    hikari.max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    validate-on-migrate: true
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
