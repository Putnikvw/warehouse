<html xmlns:th="http://www.thymeleaf.org">
<div id="productTable">
    <table>
        <thead>
        <tr>
            <th>#</th>
            <th th:each="col : ${columns}" th:text="${col}"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product, counter : ${page.content}">
            <td th:text="${page.startIndex + counter.index + 1}"></td>
            <td th:text="${product.title}"></td>
            <td th:text="${product.handle}"></td>
            <td th:text="${product.productType}"></td>
        </tr>
        </tbody>
    </table>

    <div class="pagination-controls">
        <!-- Page Size Selector -->
        <div class="page-size-controls">
            <label for="pageSize">Items per page:</label>
            <select
                    id="pageSize"
                    name="pageSize"
                    class="form-select"
                    th:attr="hx-get=@{/products/table(page=0)}"
                    hx-target="#product-table"
                    hx-swap="innerHTML"
                    hx-trigger="change"
                    hx-include="this">
                <option value="10" th:selected="${page.pageSize == 10}">10</option>
                <option value="25" th:selected="${page.pageSize == 25}">25</option>
                <option value="50" th:selected="${page.pageSize == 50}">50</option>
            </select>
        </div>


        <!-- Pagination -->
        <div class="pagination" style="margin-top:1rem;">
            <button
                    class="btn btn-secondary"
                    th:attr="hx-get=@{/products/table(page=${page.currentPage - 1},pageSize=${page.pageSize})}"
                    hx-target="#product-table"
                    hx-swap="innerHTML"
                    th:disabled="${page.currentPage == 0}">
                Previous
            </button>

            <span class="page-counter">Page <span th:text="${page.currentPage + 1}"></span> of <span
                    th:text="${page.totalPages}"></span></span>

            <button
                    class="btn btn-secondary"
                    th:attr="hx-get=@{/products/table(page=${page.currentPage + 1},pageSize=${page.pageSize})}"
                    hx-target="#product-table"
                    hx-swap="innerHTML"
                    th:disabled="${page.currentPage + 1 >= page.totalPages}">
                Next
            </button>
        </div>
    </div>

</div>
